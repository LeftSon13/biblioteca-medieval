# SESSÃO 1 — Conexão local com o PostgreSQL.
# Estes padrões combinam com compose.yaml e podem ser substituídos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55436/biblioteca_medieval}
spring.datasource.username=${DB_USERNAME:biblioteca}
spring.datasource.password=${DB_PASSWORD:biblioteca}

# Em estudo, "update" cria ou ajusta as tabelas conforme as entidades JPA.
# Para um sistema publicado, migrations seriam preferíveis.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantido ativo para simplificar a leitura dos relacionamentos ao devolver JSON.
spring.jpa.open-in-view=true

server.port=8080
spring.application.name=biblioteca-medieval
